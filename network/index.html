<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ATSFY Marketplace Network | Find Clients. Find Services. Grow.</title>
<meta name="description" content="ATSFY Marketplace Network connects clients, businesses, freelancers, agencies and service providers. Find services, find clients, post requirements and grow with a professional marketplace subscription.">
<meta name="robots" content="index,follow">
<meta property="og:title" content="ATSFY Marketplace Network">
<meta property="og:description" content="Find clients. Find services. Build business.">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#070908;--panel:#0d120f;--panel2:#111813;--line:rgba(247,246,242,.11);--text:#f7f6f2;--muted:#89958d;--green:#285040;--gold:#d9a43b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.glass{background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));border:1px solid var(--line);backdrop-filter:blur(16px)}.gold{color:var(--gold)}.muted{color:var(--muted)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 18px;font-weight:700;font-size:13px;transition:.25s}.btn:hover{transform:translateY(-2px)}.primary{background:var(--text);color:#08100b}.primary:hover{background:var(--gold)}.ghost{border:1px solid rgba(247,246,242,.18);background:rgba(255,255,255,.03)}.ghost:hover{border-color:var(--gold);color:var(--gold)}.nav{border-bottom:1px solid var(--line);background:rgba(7,9,8,.82);backdrop-filter:blur(20px)}.navlink{color:#9ba59e;font-size:13px}.navlink:hover,.navlink.active{color:#fff}.input{width:100%;background:#080d0a;border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:#fff;outline:none}.input:focus{border-color:rgba(217,164,59,.7);box-shadow:0 0 0 3px rgba(217,164,59,.08)}.tag{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:11px;color:#aeb7b1}.card{background:#0c110e;border:1px solid var(--line);border-radius:22px}.card:hover{border-color:rgba(217,164,59,.35)}.stat{border-right:1px solid var(--line)}.stat:last-child{border:0}.hide{display:none!important}.page{max-width:1280px;margin:auto;padding:38px 22px 90px}.hero{padding:70px 0 40px}.hero h1{font-size:clamp(42px,7vw,88px);line-height:.9;letter-spacing:-.065em;margin:18px 0}.hero h1 span{color:transparent;-webkit-text-stroke:1px rgba(247,246,242,.65)}.search{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:35px;max-width:850px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;border:1px solid var(--line)}.grid4>div{padding:22px;border-right:1px solid var(--line)}.grid4>div:last-child{border:0}.pill{padding:7px 10px;border-radius:9px;background:rgba(40,80,64,.2);color:#b7c6bc;font-size:11px}.sidebar{position:sticky;top:88px;height:max-content}.dashgrid{display:grid;grid-template-columns:230px 1fr;gap:18px}.sidebtn{display:flex;width:100%;gap:10px;align-items:center;padding:11px 12px;border-radius:11px;color:#8d9991;background:none;border:0;text-align:left;font-size:13px}.sidebtn:hover,.sidebtn.active{background:rgba(40,80,64,.22);color:#fff}.avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#285040,#14251b);display:grid;place-items:center;font-weight:800;color:#d9a43b}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);z-index:50;display:grid;place-items:center;padding:18px}.modalbox{width:min(650px,100%);max-height:90vh;overflow:auto;background:#0d120f;border:1px solid var(--line);border-radius:24px;padding:25px}.toast{position:fixed;right:20px;bottom:20px;background:#f7f6f2;color:#07100a;padding:13px 17px;border-radius:13px;font-weight:700;z-index:100}.check{color:#d9a43b}.progress{height:7px;border-radius:99px;background:#1a211c;overflow:hidden}.progress>i{display:block;height:100%;background:var(--gold);border-radius:99px}.plan{padding:25px;border:1px solid var(--line);border-radius:22px;background:#0c110e}.plan.featured{border-color:rgba(217,164,59,.65);box-shadow:0 0 45px rgba(217,164,59,.07)}@media(max-width:900px){.grid3,.grid4{grid-template-columns:1fr 1fr}.dashgrid{grid-template-columns:1fr}.sidebar{position:static}.hero{padding-top:40px}}@media(max-width:640px){.grid3,.grid2,.grid4,.search{grid-template-columns:1fr}.grid4>div{border-right:0;border-bottom:1px solid var(--line)}.hero h1{font-size:46px}}
</style>
</head>
<body>
<header class="nav sticky top-0 z-40">
<div class="max-w-[1280px] mx-auto px-5 h-[72px] flex items-center justify-between">
<a href="#home" class="flex items-center gap-3" onclick="go('home')"><div class="w-10 h-10 rounded-xl bg-[#285040] grid place-items-center font-black text-[#d9a43b]">A</div><div><b>ATSFY</b><div class="text-[9px] tracking-[.2em] text-gray-500">MARKETPLACE NETWORK</div></div></a>
<nav class="hidden md:flex gap-7"><a class="navlink" href="#services" onclick="go('services')">Find Services</a><a class="navlink" href="#providers" onclick="go('providers')">Find Providers</a><a class="navlink" href="#requirements" onclick="go('requirements')">Find Clients</a><a class="navlink" href="#pricing" onclick="go('pricing')">Pricing</a></nav>
<div class="flex gap-2"><button class="btn ghost hidden sm:inline-flex" onclick="openAuth('login')">Sign in</button><button class="btn primary" onclick="openAuth('signup')">Join Marketplace</button></div>
</div>
</header>
<main id="app"></main>
<div id="modal" class="modal hide"></div>
<div id="toast" class="toast hide"></div>
<script>
const key='atsfy_network_v1';
const seed={
profile:null, role:null, plan:'free',
providers:[
{name:'ATSFY Technologies',type:'Company',cat:'AI & Digital Solutions',loc:'Tripura • India',rating:'4.9',projects:42,verified:true,price:'₹4,999+',skills:['AI','SaaS','Automation'],initial:'A'},
{name:'NorthEast Digital Studio',type:'Agency',cat:'Web & Branding',loc:'Agartala • India',rating:'4.8',projects:28,verified:true,price:'₹12,000+',skills:['Web','Branding','SEO'],initial:'N'},
{name:'Arun DevWorks',type:'Freelancer',cat:'Software Development',loc:'Remote • India',rating:'4.7',projects:19,verified:false,price:'₹8,500+',skills:['React','Node','Supabase'],initial:'A'}
],
requirements:[
{title:'E-commerce website for local fashion brand',cat:'Web Development',budget:'₹25,000–₹50,000',loc:'Agartala / Remote',posted:'2h ago',status:'OPEN',client:'Fellista Retail'},
{title:'WhatsApp automation for education business',cat:'Automation',budget:'₹10,000–₹25,000',loc:'Tripura',posted:'5h ago',status:'OPEN',client:'Learning Hub'},
{title:'Monthly digital marketing & SEO partner',cat:'Marketing',budget:'₹15,000–₹30,000/mo',loc:'India',posted:'1d ago',status:'OPEN',client:'Local Growth Co.'}
]};
let db=JSON.parse(localStorage.getItem(key)||'null')||seed;
function save(){localStorage.setItem(key,JSON.stringify(db))}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hide');setTimeout(()=>t.classList.add('hide'),2400)}
function go(route){
window.scrollTo({top:0,behavior:'smooth'});
if(route==='home')home();if(route==='services')services();if(route==='providers')providers();if(route==='requirements')requirements();if(route==='pricing')pricing();if(route==='dashboard')dashboard();
}
function home(){
document.getElementById('app').innerHTML=`
<section class="page hero"><div class="gold text-xs font-bold tracking-[.2em] uppercase">01 / Marketplace Network</div><h1>Find clients.<br><span>Find services.</span><br>Build business.</h1><p class="muted max-w-2xl text-lg leading-8">A professional marketplace connecting businesses, clients, freelancers, agencies and service providers — with profiles, opportunities, matching and subscription tools.</p><div class="search"><input class="input" placeholder="What service or opportunity are you looking for?" onkeydown="if(event.key==='Enter')go('services')"><button class="btn primary px-7" onclick="go('services')"><i data-lucide="search"></i> Explore</button></div><div class="flex flex-wrap gap-2 mt-5"><span class="tag">Web Development</span><span class="tag">AI & Automation</span><span class="tag">Marketing</span><span class="tag">Design</span><span class="tag">Business Services</span></div></section>
<section class="page pt-4"><div class="grid4"><div><b class="text-2xl">2-sided</b><p class="muted text-xs mt-2">Client + Provider network</p></div><div><b class="text-2xl">AI-ready</b><p class="muted text-xs mt-2">Matching & recommendations</p></div><div><b class="text-2xl">Monthly</b><p class="muted text-xs mt-2">Subscription-led growth</p></div><div><b class="text-2xl">Verified</b><p class="muted text-xs mt-2">Trust-first profiles</p></div></div></section>
<section class="page"><div class="flex justify-between items-end mb-7"><div><div class="gold text-[10px] tracking-[.18em]">HOW IT WORKS</div><h2 class="text-4xl font-semibold tracking-tight mt-2">One network. Two sides.</h2></div></div><div class="grid3"><div class="card p-7"><div class="avatar mb-6"><i data-lucide="briefcase"></i></div><h3 class="text-xl font-bold">Find Clients</h3><p class="muted text-sm leading-6 mt-2">Create a provider profile, publish services, discover active requirements and receive qualified leads.</p><button class="btn ghost mt-6" onclick="openProfile('provider')">Create Provider Profile →</button></div><div class="card p-7"><div class="avatar mb-6"><i data-lucide="search"></i></div><h3 class="text-xl font-bold">Find Services</h3><p class="muted text-sm leading-6 mt-2">Tell the marketplace what you need, compare providers, request quotes and start projects.</p><button class="btn ghost mt-6" onclick="openProfile('client')">Create Client Profile →</button></div><div class="card p-7"><div class="avatar mb-6"><i data-lucide="sparkles"></i></div><h3 class="text-xl font-bold">Get Matched</h3><p class="muted text-sm leading-6 mt-2">Use profile quality, skills, budget, location, availability and reviews to improve matching.</p><button class="btn ghost mt-6" onclick="go('providers')">Explore Network →</button></div></div></section>
<section class="page"><div class="card p-8 md:p-12 bg-gradient-to-br from-[#13271c] to-[#0b0f0c]"><div class="gold text-[10px] tracking-[.18em]">ATSFY MARKETPLACE 2.0</div><h2 class="text-4xl md:text-6xl font-semibold tracking-tight mt-3 max-w-4xl">Your profile becomes your storefront. Your subscription becomes your access to opportunity.</h2><div class="flex flex-wrap gap-3 mt-8"><button class="btn primary" onclick="openAuth('signup')">Create your profile</button><button class="btn ghost" onclick="go('pricing')">View membership plans</button></div></div></section>`;
lucide.createIcons()
}
function services(){
document.getElementById('app').innerHTML=`<section class="page"><div class="gold text-[10px] tracking-[.18em]">02 / FIND SERVICES</div><h1 class="text-5xl font-semibold tracking-tight mt-3">Services marketplace</h1><p class="muted mt-3 max-w-2xl">Discover professionals and businesses by capability, category and trust signals.</p><div class="grid3 mt-10">${['Website Development','AI Chatbots & Automation','Branding & Design','Digital Marketing & SEO','Custom SaaS Development','Business Consulting'].map((x,i)=>`<div class="card p-6"><div class="flex justify-between"><span class="pill">${['Digital','AI','Creative','Marketing','Engineering','Business'][i]}</span><span class="gold text-xs">AVAILABLE</span></div><h3 class="text-xl font-bold mt-5">${x}</h3><p class="muted text-sm leading-6 mt-2">Find verified providers, compare profiles and request a quote.</p><button class="btn ghost mt-5" onclick="go('providers')">View providers →</button></div>`).join('')}</div></section>`;
lucide.createIcons()
}
function providers(){
document.getElementById('app').innerHTML=`<section class="page"><div class="gold text-[10px] tracking-[.18em]">03 / FIND PROVIDERS</div><div class="flex flex-wrap justify-between gap-5 items-end"><div><h1 class="text-5xl font-semibold tracking-tight mt-3">Find the right people.</h1><p class="muted mt-3">Profiles ranked by capability, trust, experience and fit.</p></div><button class="btn primary" onclick="openProfile('provider')">Create provider profile</button></div><div class="flex flex-wrap gap-2 mt-8"><span class="tag">All</span><span class="tag">Verified</span><span class="tag">AI</span><span class="tag">Web</span><span class="tag">Marketing</span><span class="tag">Design</span></div><div class="grid3 mt-8">${db.providers.map(p=>providerCard(p)).join('')}</div></section>`;
lucide.createIcons()
}
function providerCard(p){return `<article class="card p-6"><div class="flex justify-between items-start"><div class="avatar">${esc(p.initial)}</div>${p.verified?'<span class="pill text-[#d9a43b]">✓ VERIFIED</span>':''}</div><h3 class="text-xl font-bold mt-5">${esc(p.name)}</h3><p class="gold text-sm mt-1">${esc(p.cat)}</p><p class="muted text-xs mt-2">${esc(p.loc)} • ${esc(p.type)}</p><div class="flex gap-2 mt-4 flex-wrap">${p.skills.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div class="grid grid-cols-3 border-t border-[var(--line)] mt-5 pt-5 text-xs"><div><b>★ ${p.rating}</b><small class="block muted mt-1">Rating</small></div><div><b>${p.projects}</b><small class="block muted mt-1">Projects</small></div><div><b>${esc(p.price)}</b><small class="block muted mt-1">Starting</small></div></div><div class="flex gap-2 mt-5"><button class="btn primary flex-1" onclick="toast('Connection request created')">Request Quote</button><button class="btn ghost" onclick="toast('Profile preview coming next phase')">Profile</button></div></article>`}
function requirements(){
document.getElementById('app').innerHTML=`<section class="page"><div class="gold text-[10px] tracking-[.18em]">04 / FIND CLIENTS</div><div class="flex flex-wrap justify-between gap-5 items-end"><div><h1 class="text-5xl font-semibold tracking-tight mt-3">Active opportunities.</h1><p class="muted mt-3">Businesses and clients posting work they need done.</p></div><button class="btn primary" onclick="postRequirement()">Post a requirement</button></div><div class="grid2 mt-9">${db.requirements.map(r=>`<article class="card p-6"><div class="flex justify-between gap-4"><span class="pill">${esc(r.cat)}</span><span class="gold text-xs">${r.status}</span></div><h3 class="text-xl font-bold mt-5">${esc(r.title)}</h3><p class="muted text-sm mt-2">${esc(r.client)} • ${esc(r.loc)}</p><div class="flex justify-between items-end border-t border-[var(--line)] mt-5 pt-5"><div><small class="muted block">Budget</small><b>${esc(r.budget)}</b></div><div class="text-right"><small class="muted block">${esc(r.posted)}</small><button class="btn primary mt-2" onclick="toast('Proposal flow opened — Phase 2')">Send proposal</button></div></div></article>`).join('')}</div></section>`;
lucide.createIcons()
}
function pricing(){
const plans=[['Free','₹0','Basic profile','1 service','Limited discovery','Basic leads'],['Starter','₹499','Verified profile','5 services','20 leads / month','Client discovery'],['Professional','₹999','Unlimited services','50 leads / month','AI matching ready','Priority discovery'],['Business','₹1,999','Unlimited leads','Featured placement','Team members','Advanced analytics']];
document.getElementById('app').innerHTML=`<section class="page"><div class="gold text-[10px] tracking-[.18em]">05 / MEMBERSHIP</div><h1 class="text-5xl font-semibold tracking-tight mt-3">Membership that unlocks opportunity.</h1><p class="muted max-w-2xl mt-3">Start free. Upgrade when you need more visibility, leads and marketplace intelligence.</p><div class="grid4 mt-10 bg-transparent border-0 gap-4">${plans.map((p,i)=>`<div class="plan ${i===2?'featured':''}"><span class="pill">${i===2?'MOST POPULAR':'PROVIDER PLAN'}</span><h3 class="text-2xl font-bold mt-6">${p[0]}</h3><div class="text-4xl font-bold mt-3">${p[1]}<small class="text-sm muted font-normal">${i?' / month':''}</small></div><div class="space-y-3 mt-7 text-sm muted">${p.slice(2).map(x=>`<div><span class="check">✓</span> ${x}</div>`).join('')}</div><button class="btn ${i===2?'primary':'ghost'} w-full mt-8" onclick="selectPlan('${p[0]}','${p[1]}')">${i?'Choose plan':'Start free'}</button></div>`).join('')}</div><div class="card p-7 mt-7"><h3 class="font-bold">Client memberships</h3><p class="muted text-sm mt-2">Client Pro ₹499/month and Business ₹999/month can unlock unlimited requirements, advanced sourcing, team access and priority matching in the next billing phase.</p></div></section>`;
lucide.createIcons()
}
function dashboard(){
const p=db.profile||{name:'Your Marketplace Profile',role:db.role||'provider',category:'Not completed'};
document.getElementById('app').innerHTML=`<section class="page"><div class="flex justify-between items-end gap-5"><div><div class="gold text-[10px] tracking-[.18em]">06 / YOUR DASHBOARD</div><h1 class="text-5xl font-semibold tracking-tight mt-3">Good to see you.</h1><p class="muted mt-3">Manage your profile, opportunities and membership.</p></div><button class="btn ghost" onclick="openProfile(db.role||'provider')">Edit profile</button></div><div class="dashgrid mt-9"><aside class="sidebar card p-3"><button class="sidebtn active"><i data-lucide="layout-dashboard"></i> Overview</button><button class="sidebtn" onclick="openProfile(db.role||'provider')"><i data-lucide="user"></i> My Profile</button><button class="sidebtn" onclick="go(db.role==='client'?'requirements':'providers')"><i data-lucide="target"></i> Opportunities</button><button class="sidebtn" onclick="go('pricing')"><i data-lucide="credit-card"></i> Subscription</button><button class="sidebtn" onclick="toast('Messaging is queued for Phase 2')"><i data-lucide="message-square"></i> Messages</button></aside><div><div class="grid3"><div class="card p-6"><small class="muted">Profile views</small><b class="text-3xl block mt-3">128</b><span class="gold text-xs">+18% this month</span></div><div class="card p-6"><small class="muted">${db.role==='client'?'Requirements':'New leads'}</small><b class="text-3xl block mt-3">${db.role==='client'?'3':'12'}</b><span class="gold text-xs">Active</span></div><div class="card p-6"><small class="muted">Membership</small><b class="text-2xl block mt-3 uppercase">${esc(db.plan)}</b><span class="gold text-xs">Upgrade available</span></div></div><div class="card p-7 mt-4"><div class="flex justify-between"><div><h3 class="text-xl font-bold">${esc(p.name)}</h3><p class="muted text-sm mt-1">${esc(p.category)} • ${esc(p.role)}</p></div><span class="pill">PROFILE ${db.profile?'ACTIVE':'DRAFT'}</span></div><div class="mt-6 progress"><i style="width:${db.profile?'82':'24'}%"></i></div><div class="flex justify-between text-xs muted mt-2"><span>Profile completeness</span><b class="text-white">${db.profile?'82':'24'}%</b></div><div class="grid2 mt-7"><div class="glass p-5 rounded-2xl"><small class="muted">Recommended next step</small><b class="block mt-2">${db.role==='client'?'Post your first requirement':'Add services & portfolio'}</b></div><div class="glass p-5 rounded-2xl"><small class="muted">Marketplace status</small><b class="block mt-2 text-[#d9a43b]">Discoverable</b></div></div></div></div></div></section>`;
lucide.createIcons()
}
function openAuth(mode){
document.getElementById('modal').innerHTML=`<div class="modalbox"><div class="flex justify-between"><div><div class="gold text-[10px] tracking-[.18em]">ATSFY NETWORK</div><h2 class="text-2xl font-bold mt-2">${mode==='login'?'Welcome back':'Join the marketplace'}</h2></div><button onclick="closeModal()">✕</button></div>${mode==='signup'?'<div class="grid2 mt-6"><button class="card p-5 text-left" onclick="closeModal();openProfile(\'provider\')"><b>Find clients</b><p class="muted text-xs mt-2">I provide services.</p></button><button class="card p-5 text-left" onclick="closeModal();openProfile(\'client\')"><b>Find services</b><p class="muted text-xs mt-2">I need services.</p></button></div>':'<input class="input mt-6" placeholder="Email"><input class="input mt-3" type="password" placeholder="Password"><button class="btn primary w-full mt-4" onclick="closeModal();toast(\'Demo sign-in successful\');go(\'dashboard\')">Sign in</button>'}<p class="muted text-xs mt-5">Phase 1 is a production-ready UX prototype. Secure Supabase authentication and recurring billing are Phase 2.</p></div>`;
document.getElementById('modal').classList.remove('hide')
}
function openProfile(role){
document.getElementById('modal').innerHTML=`<div class="modalbox"><div class="flex justify-between"><div><div class="gold text-[10px] tracking-[.18em]">PROFILE BUILDER</div><h2 class="text-2xl font-bold mt-2">${role==='provider'?'Create your provider profile':'Create your client profile'}</h2></div><button onclick="closeModal()">✕</button></div><div class="grid2 mt-6"><input id="pname" class="input" placeholder="${role==='provider'?'Your name / company':'Your name / company'}"><input id="pcat" class="input" placeholder="${role==='provider'?'Primary service category':'Services you need'}"></div><input id="ploc" class="input mt-3" placeholder="Location / Service area"><textarea id="pabout" class="input mt-3 min-h-[110px]" placeholder="${role==='provider'?'Tell clients what you do...':'Tell providers what you need...'}"></textarea><div class="grid2 mt-3"><input id="pskills" class="input" placeholder="${role==='provider'?'Skills (comma separated)':'Budget range'}"><select id="ptype" class="input"><option>Individual</option><option>Company</option><option>Agency</option><option>Startup</option></select></div><button class="btn primary w-full mt-5" onclick="saveProfile('${role}')">Publish profile</button></div>`;
document.getElementById('modal').classList.remove('hide')
}
function saveProfile(role){
db.role=role;db.profile={name:document.getElementById('pname').value||'Marketplace Member',category:document.getElementById('pcat').value||'Business Services',loc:document.getElementById('ploc').value||'India',about:document.getElementById('pabout').value||'',skills:document.getElementById('pskills').value||'',type:document.getElementById('ptype').value,role};save();closeModal();toast('Profile created successfully');go('dashboard')
}
function postRequirement(){
document.getElementById('modal').innerHTML=`<div class="modalbox"><div class="flex justify-between"><div><div class="gold text-[10px] tracking-[.18em]">POST OPPORTUNITY</div><h2 class="text-2xl font-bold mt-2">What do you need?</h2></div><button onclick="closeModal()">✕</button></div><input id="rt" class="input mt-6" placeholder="Requirement title"><input id="rc" class="input mt-3" placeholder="Category"><input id="rb" class="input mt-3" placeholder="Budget"><input id="rl" class="input mt-3" placeholder="Location / Remote"><textarea id="rd" class="input mt-3 min-h-[110px]" placeholder="Describe the requirement"></textarea><button class="btn primary w-full mt-5" onclick="saveRequirement()">Publish requirement</button></div>`;
document.getElementById('modal').classList.remove('hide')
}
function saveRequirement(){
db.requirements.unshift({title:document.getElementById('rt').value||'New service requirement',cat:document.getElementById('rc').value||'General',budget:document.getElementById('rb').value||'Discuss',loc:document.getElementById('rl').value||'Remote',posted:'just now',status:'OPEN',client:db.profile?.name||'Marketplace Client'});save();closeModal();toast('Requirement published');go('requirements')
}
function selectPlan(name,price){db.plan=name.toLowerCase();save();toast(name==='Free'?'Free membership activated':'Plan selected — billing integration is Phase 2');go('dashboard')}
function closeModal(){document.getElementById('modal').classList.add('hide')}
home();
</script>
</body></html>
