<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATSFY Admin — Employee Revenue OS</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Inter,system-ui,sans-serif}button,input,select,textarea{outline:none}button:focus,input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(217,164,59,.25)}</style></head>
<body class="min-h-screen bg-[#F7F6F2]"><div id="login" class="min-h-screen flex items-center justify-center p-5"><div class="bg-white border rounded-3xl p-8 w-full max-w-md shadow-sm"><div class="w-12 h-12 rounded-xl bg-[#1C301F] text-[#D9A43B] flex items-center justify-center font-black text-xl mb-5">A</div><h1 class="text-2xl font-bold text-[#1C301F]">ATSFY Admin</h1><p class="text-sm text-gray-500 mt-2">Private Employee Revenue OS. Only accounts with the admin role can access the data.</p><form id="loginForm" class="space-y-4 mt-6"><input id="email" type="email" required placeholder="Admin email" autocomplete="username" class="w-full border rounded-xl px-4 py-3"><input id="password" type="password" required placeholder="Password" autocomplete="current-password" class="w-full border rounded-xl px-4 py-3"><button class="w-full rounded-xl bg-[#1C301F] text-white py-3 font-semibold">Sign in as Admin</button><p id="error" class="text-sm text-red-600 min-h-5"></p></form></div></div><div id="app" class="hidden"></div><script src="/admin/app.js"></script></body></html>
